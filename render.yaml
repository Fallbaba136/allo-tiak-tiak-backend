services:
  - type: web
    name: allo-tiak-tiak-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: allo-tiak-tiak-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: AT_USERNAME
        value: sandbox
      - key: AT_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false

databases:
  - name: allo-tiak-tiak-db
    plan: free
    databaseName: allo_tiak_tiak
    user: allo_user